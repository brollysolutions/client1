# Reverse proxy for the Loans & Real Estate platform (DigitalOcean droplet).
# Mounted into nginx:1.27-alpine at /etc/nginx/conf.d/ (see docker-compose.prod.example.yml).
#
# Compression is terminated HERE for both apps: next.config.ts sets
# `compress: false` on the assumption that this file gzips web HTML/RSC and
# API JSON uniformly. If you remove nginx from the stack, re-enable Next's
# built-in compression.
#
# TLS: the commented 443 server below is ready for certbot certificates
# (certbot certonly --webroot, or DO's load balancer termination instead).
# Until TLS is set up, the port-80 server proxies directly so the site works
# immediately after `docker compose up`.

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml
    font/woff2;

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Docker healthcheck target (compose: wget --spider .../nginx-health).
    # Answered directly by nginx so the check stays green during app restarts;
    # upstream health has its own per-service checks.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # KYC document uploads go through /api.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The API refuses to boot in production unless TRUST_PROXY_HEADERS is on,
    # and it trusts exactly these headers — keep them accurate.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_read_timeout 60s;

    # Hashed build assets: content-addressed filenames, safe to cache forever.
    location /_next/static/ {
        proxy_pass http://web_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Illustration filenames are stable/path-referenced (art changes get new
    # filenames) — mirrors the headers() rule in next.config.ts.
    location /illustrations/ {
        proxy_pass http://web_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api_upstream;
    }

    location / {
        proxy_pass http://web_upstream;
    }
}

# ---------------------------------------------------------------------------
