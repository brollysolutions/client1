allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Pin patched sharp for Next.js image optimization. 0.35.4 includes the libheif
# fixes for GHSA-rgj7-g3m4-5g8c and retains the earlier libvips security fixes.
overrides:
  # ExcelJS uses only uuid.v4; 11.1.1 retains its CJS interface and fixes
  # GHSA-w5hq-g745-h8pq. Patch legacy brace-expansion in its archive tools.
  'exceljs>uuid': '11.1.1'
  'brace-expansion@^1.1.7': '1.1.18'
  sharp: '0.35.4'
  # postcss <8.5.10 (GHSA-qx2v-qp2m-jg93) pulled in transitively through next.
  # Patch-level bump, safe for the Tailwind v4 postcss pipeline.
  postcss: '>=8.5.10'
  # browserslist <=4.28.6 is vulnerable to unbounded cache growth and malformed
  # stats crashes (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g) through next/Babel.
  browserslist: '4.28.7'
