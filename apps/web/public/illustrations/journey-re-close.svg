  <rect x="192" y="86" width="96" height="172" rx="4" fill="#8A5A34"/>
  <rect x="192" y="86" width="96" height="172" rx="4" fill="#7A4E28" fill-opacity="0.35"/>
  <rect x="274" y="88" width="14" height="168" rx="3" fill="#5E3D22" opacity="0.45"/>
