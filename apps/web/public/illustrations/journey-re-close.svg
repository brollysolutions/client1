  <rect x="204" y="182" width="30" height="60" rx="3" fill="#F3F3EE" fill-opacity="0.12" stroke="#F3F3EE" stroke-opacity="0.25"/>
  <rect x="246" y="182" width="30" height="60" rx="3" fill="#F3F3EE" fill-opacity="0.12" stroke="#F3F3EE" stroke-opacity="0.25"/>
