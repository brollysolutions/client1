  </g>

  <!-- sparkle + dots -->
  <path d="M82 66l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#95CCDD"/>
  <circle cx="244" cy="66" r="3" fill="#95CCDD"/>
