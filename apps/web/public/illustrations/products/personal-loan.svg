  <!-- gold coins -->
  <ellipse cx="252" cy="184" rx="16" ry="5.5" fill="#C08A2E"/>
  <ellipse cx="252" cy="181" rx="16" ry="5.5" fill="#E8B54D"/>
  <g transform="translate(258,158)">
    <circle r="16" fill="#E8B54D" stroke="#C08A2E" stroke-width="2.4"/>
