  </g>

  <!-- leather wallet -->
  <rect x="92" y="112" width="136" height="74" rx="14" fill="#B4794A"/>
  <path d="M92 148h136v24a14 14 0 0 1-14 14H106a14 14 0 0 1-14-14z" fill="#8F5B33"/>
  <path d="M106 112h108a14 14 0 0 1 12 7H94a14 14 0 0 1 12-7z" fill="#C98F5F"/>
  <rect x="99" y="119" width="122" height="60" rx="9" stroke="#EAD9C4" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.5"/>
  <!-- gold snap clasp -->
  <rect x="188" y="138" width="46" height="24" rx="9" fill="#8F5B33"/>
