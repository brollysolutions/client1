<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none" role="img">
  <defs><filter id="plS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter></defs>
  <circle cx="160" cy="112" r="90" fill="#D0E7E6" opacity="0.4"/>
  <ellipse cx="160" cy="200" rx="95" ry="12" fill="#293681" opacity="0.1" filter="url(#plS)"/>

  <!-- banknotes peeking out of the wallet -->
