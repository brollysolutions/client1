  <circle cx="160" cy="112" r="90" fill="#D0E7E6" opacity="0.4"/>
  <ellipse cx="160" cy="200" rx="95" ry="12" fill="#293681" opacity="0.1" filter="url(#ccS)"/>

  <!-- back card -->
