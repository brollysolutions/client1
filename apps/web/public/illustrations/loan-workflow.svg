<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" fill="none" role="img">
  <defs>
    <linearGradient id="lwPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D0E7E6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#D0E7E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D0E7E6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lwGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3F3EE" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#F3F3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F3F3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="lwSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- ambient plate -->
  <ellipse cx="580" cy="150" rx="565" ry="150" fill="url(#lwGlow)"/>
  <ellipse cx="580" cy="150" rx="560" ry="120" fill="url(#lwPlate)"/>

  <!-- faint floating finance marks (depth) -->
  <g opacity="0.10" fill="#4274D9">
    <circle cx="150" cy="42" r="16"/>
    <path d="M1010 300 h44 v-30 h-14 v18 h-16 v-26 h-14 z"/>
  </g>

  <!-- connecting rail -->
  <line x1="130" y1="150" x2="1030" y2="150" stroke="#293681" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.3"/>

  <!-- travelling coins between stations -->
  <g>
    <g transform="translate(242.5,116)">
      <circle r="14" fill="#E8B54D" stroke="#C08A2E" stroke-width="2"/>
      <circle r="10" fill="none" stroke="#F2D28A" stroke-width="1.6" opacity="0.8"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6B4E16" text-anchor="middle">&#8377;</text>
    </g>
    <g transform="translate(467.5,116)">
      <circle r="14" fill="#E8B54D" stroke="#C08A2E" stroke-width="2"/>
      <circle r="10" fill="none" stroke="#F2D28A" stroke-width="1.6" opacity="0.8"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6B4E16" text-anchor="middle">&#8377;</text>
    </g>
    <g transform="translate(692.5,116)">
      <circle r="14" fill="#E8B54D" stroke="#C08A2E" stroke-width="2"/>
      <circle r="10" fill="none" stroke="#F2D28A" stroke-width="1.6" opacity="0.8"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6B4E16" text-anchor="middle">&#8377;</text>
    </g>
    <g transform="translate(917.5,116)">
      <circle r="14" fill="#E8B54D" stroke="#C08A2E" stroke-width="2"/>
      <circle r="10" fill="none" stroke="#F2D28A" stroke-width="1.6" opacity="0.8"/>
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6B4E16" text-anchor="middle">&#8377;</text>
    </g>
  </g>

  <!-- arrowheads into each next station -->
  <g stroke="#4274D9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 142 L310 150 L300 158"/>
    <path d="M525 142 L535 150 L525 158"/>
    <path d="M750 142 L760 150 L750 158"/>
    <path d="M975 142 L985 150 L975 158"/>
  </g>

  <!-- ================= STATION 1 : APPLY ================= -->
  <g transform="translate(130,150)" opacity="0.6">
    <ellipse cx="0" cy="66" rx="52" ry="9" fill="#293681" opacity="0.12" filter="url(#lwSoft)"/>
    <circle r="58" fill="#E8F2F1" stroke="#4274D9" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#95CCDD" stroke-width="1.5" opacity="0.7" transform="scale(0.82)"/>
    <!-- document -->
    <rect x="-22" y="-30" width="44" height="60" rx="6" fill="#FFFFFF" stroke="#293681" stroke-width="2.5"/>
    <line x1="-12" y1="-16" x2="12" y2="-16" stroke="#4274D9" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#95CCDD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="6" x2="2" y2="6" stroke="#95CCDD" stroke-width="3" stroke-linecap="round"/>
    <!-- pencil signing -->
    <g transform="translate(6,20) rotate(-52)">
      <rect x="0" y="-4" width="30" height="8" rx="2" fill="#4274D9" stroke="#293681" stroke-width="1.6"/>
      <rect x="0" y="-4" width="6" height="8" rx="2" fill="#293681"/>
      <path d="M30 -4 L38 0 L30 4 Z" fill="#F3F3EE" stroke="#293681" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M35 -1.6 L38 0 L35 1.6 Z" fill="#293681"/>
    </g>
    <circle cx="42" cy="-42" r="16" fill="#4274D9"/>
    <text x="42" y="-36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <!-- ================= STATION 2 : VERIFY ================= -->
  <g transform="translate(355,150)" opacity="0.45">
    <ellipse cx="0" cy="66" rx="52" ry="9" fill="#293681" opacity="0.12" filter="url(#lwSoft)"/>
    <circle r="58" fill="#E8F2F1" stroke="#4274D9" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#95CCDD" stroke-width="1.5" opacity="0.7" transform="scale(0.82)"/>
    <!-- ID card -->
    <rect x="-30" y="-24" width="54" height="40" rx="5" fill="#FFFFFF" stroke="#293681" stroke-width="2.5"/>
    <circle cx="-16" cy="-8" r="8" fill="#95CCDD"/>
    <path d="M-24 12 a8 8 0 0 1 16 0" fill="#95CCDD"/>
    <line x1="0" y1="-12" x2="16" y2="-12" stroke="#4274D9" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-2" x2="16" y2="-2" stroke="#95CCDD" stroke-width="3" stroke-linecap="round"/>
    <!-- magnifier + check -->
    <circle cx="16" cy="16" r="15" fill="#E8F2F1" stroke="#4274D9" stroke-width="3"/>
    <path d="M9 16 L14 21 L23 10" stroke="#293681" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="27" y1="27" x2="36" y2="36" stroke="#293681" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="-42" r="16" fill="#4274D9"/>
    <text x="42" y="-36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <!-- ================= STATION 3 : APPROVED ================= -->
  <g transform="translate(580,150)" opacity="0.35">
    <ellipse cx="0" cy="66" rx="52" ry="9" fill="#293681" opacity="0.12" filter="url(#lwSoft)"/>
    <circle r="58" fill="#E8F2F1" stroke="#4274D9" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#95CCDD" stroke-width="1.5" opacity="0.7" transform="scale(0.82)"/>
    <!-- ribbon tails -->
    <path d="M-12 20 L-18 44 L-7 37 L-1 47 L4 24 Z" fill="#293681"/>
    <!-- rosette -->
    <g fill="#293681">
      <rect x="-24" y="-24" width="48" height="48" rx="12"/>
      <rect x="-24" y="-24" width="48" height="48" rx="12" transform="rotate(45)"/>
    </g>
    <circle r="26" fill="#4274D9"/>
    <circle r="26" fill="none" stroke="#95CCDD" stroke-width="2.5"/>
    <path d="M-11 0 L-3 9 L13 -10" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="-42" r="16" fill="#4274D9"/>
    <text x="42" y="-36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <!-- ================= STATION 4 : DISBURSED ================= -->
  <g transform="translate(805,150)">
    <ellipse cx="0" cy="66" rx="52" ry="9" fill="#293681" opacity="0.12" filter="url(#lwSoft)"/>
    <circle r="58" fill="#E8F2F1" stroke="#4274D9" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#95CCDD" stroke-width="1.5" opacity="0.7" transform="scale(0.82)"/>
    <!-- bank -->
    <rect x="-32" y="26" width="64" height="8" rx="2" fill="#293681"/>
    <rect x="-28" y="18" width="56" height="8" fill="#D8CBB0"/>
    <rect x="-23" y="-6" width="8" height="24" fill="#D8CBB0" stroke="#293681" stroke-width="0.75"/>
    <rect x="-9" y="-6" width="8" height="24" fill="#D8CBB0" stroke="#293681" stroke-width="0.75"/>
    <rect x="5" y="-6" width="8" height="24" fill="#D8CBB0" stroke="#293681" stroke-width="0.75"/>
    <rect x="19" y="-6" width="8" height="24" fill="#D8CBB0" stroke="#293681" stroke-width="0.75"/>
    <rect x="-30" y="-12" width="60" height="7" fill="#293681"/>
    <path d="M-34 -12 L0 -34 L34 -12 Z" fill="#4274D9" stroke="#293681" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="0" y="-16" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#F3F3EE" text-anchor="middle">&#8377;</text>
    <circle cx="42" cy="-42" r="16" fill="#4274D9"/>
    <text x="42" y="-36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>

  <!-- ================= STATION 5 : IN YOUR ACCOUNT ================= -->
  <g transform="translate(1030,150)">
    <ellipse cx="0" cy="66" rx="52" ry="9" fill="#293681" opacity="0.12" filter="url(#lwSoft)"/>
    <circle r="58" fill="#E8F2F1" stroke="#4274D9" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#95CCDD" stroke-width="1.5" opacity="0.7" transform="scale(0.82)"/>
    <!-- phone -->
    <rect x="-22" y="-34" width="44" height="68" rx="9" fill="#2A2E37"/>
    <rect x="-18" y="-28" width="36" height="56" rx="4" fill="#E8F2F1"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#4274D9" text-anchor="middle">&#8377;</text>
    <line x1="-9" y1="18" x2="9" y2="18" stroke="#95CCDD" stroke-width="3" stroke-linecap="round"/>
    <!-- credited badge -->
    <circle cx="18" cy="-30" r="11" fill="#4274D9" stroke="#F3F3EE" stroke-width="2"/>
    <path d="M13 -30 L17 -26 L23 -34" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="-42" r="16" fill="#4274D9"/>
    <text x="42" y="-36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  </g>

  <!-- plant, one warm element -->
  <g transform="translate(70,296)">
    <path d="M-4 -2 C -10 -20 -22 -22 -26 -30 C -14 -30 -6 -22 -4 -10 Z" fill="#4E8E6E"/>
    <path d="M0 -4 C -2 -26 6 -40 4 -50 C 14 -40 10 -18 4 -4 Z" fill="#6FA98C"/>
    <path d="M4 -2 C 10 -20 22 -20 26 -28 C 14 -30 8 -20 4 -10 Z" fill="#4E8E6E"/>
    <rect x="-16" y="-4" width="32" height="7" rx="2" fill="#293681"/>
    <path d="M-14 3 L14 3 L11 24 L-11 24 Z" fill="#C4633F" stroke="#293681" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
