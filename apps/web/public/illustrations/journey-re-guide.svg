<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="jrgGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#D0E7E6" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#D0E7E6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D0E7E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="jrgSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <ellipse cx="240" cy="182" rx="205" ry="165" fill="url(#jrgGlow)"/>
  <ellipse cx="240" cy="304" rx="150" ry="20" fill="#293681" opacity="0.12" filter="url(#jrgSoft)"/>

  <!-- house behind (context) -->
  <g transform="translate(96 118)" opacity="0.95">
    <path d="M-4 46L52 4l56 42z" fill="#C4633F"/>
    <rect x="10" y="46" width="84" height="72" fill="#F3F3EE" stroke="#293681" stroke-width="2"/>
    <rect x="44" y="82" width="22" height="36" fill="#8A5A34"/>
    <rect x="20" y="58" width="20" height="18" fill="#95CCDD" stroke="#293681" stroke-width="1.4"/>
  </g>

  <!-- speech bubble with check (the agent explaining) -->
  <g transform="translate(300 96)">
    <rect x="0" y="0" width="86" height="56" rx="12" fill="#FFFFFF" stroke="#293681" stroke-width="2"/>
    <path d="M18 56l-4 18 22-18z" fill="#FFFFFF" stroke="#293681" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="26" cy="28" r="13" fill="#4274D9"/>
    <path d="M20 28l5 5 9-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="20" width="30" height="6" rx="3" fill="#93B4E8"/>
    <rect x="48" y="32" width="22" height="6" rx="3" fill="#BFE0EA"/>
  </g>

  <!-- agent (faceless), gesturing toward the house -->
  <g transform="translate(198 0)">
    <path d="M-18 214c0-18 9-30 18-30s18 12 18 30l0 76h-36z" fill="#293681"/>
    <path d="M-18 214c0-18 9-30 18-30 -6 6 -10 16 -10 30l0 76h-8z" fill="#95CCDD" opacity="0.35"/>
    <!-- pointing arm -->
    <path d="M-14 196c-16 2-30 8-40 18l8 10c10-8 22-12 34-12z" fill="#293681"/>
    <circle cx="-46" cy="222" r="6" fill="#EAD9C4"/>
    <!-- clipboard arm -->
    <rect x="12" y="198" width="22" height="30" rx="3" fill="#F3F3EE" stroke="#293681" stroke-width="1.6"/>
    <path d="M16 208h14M16 216h10" stroke="#93B4E8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="166" r="16" fill="#EAD9C4"/>
    <path d="M-16 164a16 16 0 0 1 32 0c0-11-7-19-16-19s-16 8-16 19z" fill="#2A2E37"/>
  </g>

  <!-- client (faceless) -->
  <g transform="translate(288 0)">
    <path d="M-16 220c0-16 8-27 16-27s16 11 16 27l0 70h-32z" fill="#4274D9"/>
    <path d="M-16 220c0-16 8-27 16-27 -5 5 -9 14 -9 27l0 70h-7z" fill="#95CCDD" opacity="0.4"/>
    <circle cx="0" cy="176" r="15" fill="#EAD9C4"/>
    <path d="M-15 174a15 15 0 0 1 30 0c0-10-6-18-15-18s-15 8-15 18z" fill="#7A4E28"/>
  </g>

  <!-- sparkle -->
  <path d="M150 210l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#95CCDD"/>

  <!-- plant (one warm element) -->
  <path d="M382 306c-4-16 2-30 10-36-2 12 0 22 6 30" fill="#6FA98C"/>
  <path d="M390 306c8-12 20-16 30-14-8 8-14 16-16 26" fill="#4E8E6E"/>
  <path d="M374 306h36l-5 16h-26z" fill="#C4633F"/>
</svg>
