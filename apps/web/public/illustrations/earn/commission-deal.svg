<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none" role="img">
  <circle cx="238" cy="172" r="146" fill="#D0E7E6" opacity="0.35"/>
  <ellipse cx="240" cy="316" rx="184" ry="20" fill="#293681" opacity="0.06"/>
  <!-- agreement document -->
  <rect x="120" y="72" width="200" height="236" rx="14" fill="#FFFFFF" stroke="#293681" stroke-width="3"/>
  <rect x="146" y="100" width="120" height="14" rx="7" fill="#4274D9"/>
  <rect x="146" y="130" width="148" height="7" rx="3.5" fill="#DDE4F0"/>
  <rect x="146" y="146" width="132" height="7" rx="3.5" fill="#DDE4F0"/>
  <rect x="146" y="162" width="148" height="7" rx="3.5" fill="#DDE4F0"/>
  <!-- commission amount row -->
  <rect x="146" y="184" width="148" height="34" rx="8" fill="#D0E7E6"/>
  <text x="160" y="207" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#293681">Commission</text>
  <text x="280" y="207" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#C08A2E" text-anchor="end">&#8377;</text>
  <!-- signature line + stroke -->
  <path d="M150 252 h96" stroke="#C9D4E8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M152 250 c8 -10 14 8 22 -2 c6 -8 12 6 20 -2" fill="none" stroke="#4274D9" stroke-width="3" stroke-linecap="round"/>
  <!-- gold seal + ribbon -->
  <path d="M266 268 l-7 26 l11 -6 l11 6 l-7 -26 Z" fill="#4274D9" stroke="#293681" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="270" cy="262" r="22" fill="#E8B54D" stroke="#C08A2E" stroke-width="3"/>
  <path d="M260 262 l6 7 l13 -14" fill="none" stroke="#6B4E16" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pen -->
  <g transform="rotate(38 344 200)">
    <rect x="332" y="120" width="24" height="150" rx="8" fill="#4274D9"/>
    <rect x="332" y="120" width="24" height="34" rx="8" fill="#293681"/>
    <path d="M332 270 h24 l-12 22 Z" fill="#F3E7D8" stroke="#293681" stroke-width="2" stroke-linejoin="round"/>
    <path d="M338 284 h12 l-6 8 Z" fill="#293681"/>
  </g>
  <!-- per-deal tag -->
  <g transform="translate(96,236)">
    <path d="M0 0 h64 l20 20 l-20 20 h-64 Z" fill="#293681"/>
    <circle cx="14" cy="20" r="5" fill="#D0E7E6"/>
    <text x="46" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">per deal</text>
  </g>
</svg>
