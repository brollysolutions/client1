<svg viewBox="0 0 2400 800" width="2400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f6f1"/><stop offset="0.55" stop-color="#f3f3ee"/><stop offset="1" stop-color="#ecebe3"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f3ee" stop-opacity="1"/><stop offset="0.42" stop-color="#f3f3ee" stop-opacity="1"/><stop offset="0.58" stop-color="#f3f3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#95CCDD" stop-opacity="0.55"/><stop offset="0.55" stop-color="#4274D9" stop-opacity="0.18"/><stop offset="1" stop-color="#4274D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navyTop" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#4a5cab"/><stop offset="1" stop-color="#293681"/></linearGradient>
    <linearGradient id="navySide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3a86"/><stop offset="1" stop-color="#212c69"/></linearGradient>
    <linearGradient id="blueClay" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#6c9cf1"/><stop offset="1" stop-color="#4274D9"/></linearGradient>
    <linearGradient id="skyClay" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#c4e7f1"/><stop offset="1" stop-color="#95CCDD"/></linearGradient>
    <linearGradient id="creamClay" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e8df"/></linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#293681" flood-opacity="0.16"/></filter>
    <filter id="tinyShadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#293681" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="2400" height="800" fill="url(#bg)"/>
  <ellipse cx="1560" cy="400" rx="600" ry="460" fill="url(#glow)"/>

  <!-- back floating tiles -->
  <g filter="url(#tinyShadow)"><ellipse cx="1370" cy="612" rx="120" ry="42" fill="url(#navySide)"/><ellipse cx="1370" cy="600" rx="120" ry="42" fill="url(#creamClay)"/></g>
  <g filter="url(#tinyShadow)"><ellipse cx="1710" cy="618" rx="120" ry="42" fill="url(#navySide)"/><ellipse cx="1710" cy="606" rx="120" ry="42" fill="url(#creamClay)"/></g>

  <!-- apartment block (back-left, taller) -->
  <g filter="url(#softShadow)" transform="translate(1370 596)">
    <rect x="-62" y="-300" width="124" height="300" rx="16" fill="url(#creamClay)"/>
    <rect x="46" y="-286" width="24" height="286" rx="8" fill="url(#navySide)"/>
    <rect x="-58" y="-320" width="116" height="26" rx="10" fill="url(#navyTop)"/>
    <g fill="url(#skyClay)">
      <rect x="-44" y="-268" width="30" height="34" rx="6"/><rect x="2" y="-268" width="30" height="34" rx="6"/>
      <rect x="-44" y="-210" width="30" height="34" rx="6"/><rect x="2" y="-210" width="30" height="34" rx="6"/>
      <rect x="-44" y="-152" width="30" height="34" rx="6"/><rect x="2" y="-152" width="30" height="34" rx="6"/>
      <rect x="-44" y="-94" width="30" height="34" rx="6"/><rect x="2" y="-94" width="30" height="34" rx="6"/>
    </g>
  </g>

  <!-- storefront (back-right) -->
  <g filter="url(#softShadow)" transform="translate(1710 602)">
    <rect x="-78" y="-176" width="156" height="176" rx="16" fill="url(#creamClay)"/>
    <rect x="62" y="-164" width="22" height="164" rx="8" fill="url(#navySide)"/>
    <rect x="-84" y="-176" width="168" height="30" rx="10" fill="url(#blueClay)"/>
    <rect x="-60" y="-118" width="120" height="78" rx="12" fill="url(#skyClay)"/>
    <rect x="-16" y="-40" width="34" height="40" rx="8" fill="url(#navyTop)"/>
  </g>

  <!-- main platform + front house -->
  <g filter="url(#softShadow)"><ellipse cx="1520" cy="632" rx="266" ry="94" fill="url(#navySide)"/><ellipse cx="1520" cy="616" rx="266" ry="94" fill="url(#creamClay)"/></g>
  <g filter="url(#softShadow)" transform="translate(1520 600)">
    <rect x="-104" y="-158" width="208" height="158" rx="20" fill="url(#creamClay)"/>
    <rect x="88" y="-146" width="26" height="146" rx="9" fill="url(#navySide)"/>
    <path d="M-122 -158 L0 -238 L122 -158 Z" fill="url(#navyTop)"/>
    <rect x="-30" y="-78" width="60" height="78" rx="14" fill="url(#blueClay)"/>
    <rect x="-84" y="-120" width="46" height="46" rx="10" fill="url(#skyClay)"/>
    <rect x="40" y="-120" width="46" height="46" rx="10" fill="url(#skyClay)"/>
  </g>

  <!-- map pin hovering -->
  <g filter="url(#tinyShadow)" transform="translate(1520 250)">
    <ellipse cx="0" cy="14" rx="46" ry="16" fill="#95CCDD" opacity="0.45"/>
    <path d="M0 -66 C-40 -66 -58 -34 -40 -4 C-28 16 0 42 0 42 C0 42 28 16 40 -4 C58 -34 40 -66 0 -66 Z" fill="url(#navyTop)"/>
    <circle cx="0" cy="-30" r="20" fill="#f3f3ee"/>
    <circle cx="0" cy="-30" r="9" fill="url(#blueClay)"/>
  </g>

  <!-- orbit nodes -->
  <circle cx="1450" cy="230" r="8" fill="#4274D9" opacity="0.8"/>
  <circle cx="1650" cy="200" r="7" fill="#95CCDD"/>
  <circle cx="1830" cy="360" r="8" fill="#4274D9" opacity="0.6"/>

  <rect width="2400" height="800" fill="url(#leftfade)"/>
</svg>
