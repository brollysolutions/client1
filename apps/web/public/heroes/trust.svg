<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" fill="none" role="img" aria-label="A person beside a large security shield, with OTP login and a KYC-verified ID">
  <defs>
    <linearGradient id="skyWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE0F7" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#CFE0F7" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#CFE0F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4D9F8"/>
      <stop offset="1" stop-color="#A9C6F1"/>
    </linearGradient>
    <radialGradient id="heroDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B74E4" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#3B74E4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3B74E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4274D9" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#4274D9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4274D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B88E6"/>
      <stop offset="1" stop-color="#2A52C4"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E7EE0"/>
      <stop offset="1" stop-color="#3157B8"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#1B3468" flood-opacity="0.22"/></filter>
    <filter id="heroShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173060" flood-opacity="0.3"/></filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1B3468" flood-opacity="0.22"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="800" fill="#F3F3EE"/>
  <rect width="1440" height="800" fill="url(#skyWash)"/>
  <ellipse cx="1030" cy="380" rx="470" ry="360" fill="url(#blob)" opacity="0.9" filter="url(#soft)"/>
  <ellipse cx="1080" cy="374" rx="360" ry="330" fill="url(#heroDisc)"/>
  <ellipse cx="1010" cy="702" rx="470" ry="44" fill="#B4CDF3" opacity="0.5"/>

  <g fill="#AFC3E4" opacity="0.42">
    <rect x="150" y="602" width="40" height="58" rx="3"/>
    <rect x="200" y="584" width="34" height="76" rx="3"/>
    <rect x="242" y="612" width="50" height="48" rx="3"/>
    <rect x="300" y="568" width="30" height="92" rx="3"/>
    <rect x="340" y="600" width="44" height="60" rx="3"/>
  </g>

  <ellipse cx="740" cy="702" rx="140" ry="17" fill="#173060" opacity="0.1"/>
  <ellipse cx="1090" cy="596" rx="150" ry="20" fill="#173060" opacity="0.08"/>

  <!-- Plant at the calm/scene boundary -->
  <g>
    <path d="M600 692 h52 l-7 -38 h-38 z" fill="#D26A44"/>
    <rect x="594" y="646" width="64" height="12" rx="6" fill="#D26A44"/>
    <path d="M626 646 q-24 -8 -28 -40 q22 5 28 34 z" fill="#4E9E6E"/>
    <path d="M626 646 q24 -8 28 -40 q-22 5 -28 34 z" fill="#6FC898"/>
    <path d="M626 648 q-3 -38 10 -60 q8 36 -3 60 z" fill="#5FBE8B"/>
  </g>

  <!-- Hero shield: the safe + verified focal -->
  <ellipse cx="1090" cy="366" rx="228" ry="228" fill="url(#shieldGlow)"/>
  <g filter="url(#heroShadow)">
    <path d="M948 232 q0 -34 34 -38 l108 -18 108 18 q34 4 34 38 l0 150 q0 122 -142 190 q-142 -68 -142 -190 z" fill="url(#shieldFace)"/>
    <path d="M948 232 q0 -34 34 -38 l108 -18 108 18 q34 4 34 38 l0 150 q0 122 -142 190 q-142 -68 -142 -190 z" fill="none" stroke="#8FB0F2" stroke-width="3"/>
    <path d="M966 236 q0 -24 26 -28 l98 -16 q-118 30 -128 210 l-4 0 q-2 0 -2 -14 z" fill="#FFFFFF" opacity="0.14"/>
    <circle cx="1090" cy="316" r="66" fill="#FFFFFF" opacity="0.16"/>
    <path d="M1050 318 l26 30 l52 -66" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1036" y="404" width="108" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="1056" y="430" width="68" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- YOU (faceless, blue coat), gesturing to the shield -->
  <g transform="translate(-60 -18)">
    <path d="M754 470 l-12 218 q-1 9 8 9 h24 q8 0 8 -8 l6 -210 z" fill="#232730"/>
    <path d="M816 468 l8 221 q0 8 8 8 h24 q9 0 8 -9 l-12 -216 z" fill="#2C313B"/>
    <path d="M728 690 q-4 16 14 18 l30 0 q8 0 8 -9 v-9 z" fill="#293681"/>
    <path d="M830 689 q-4 16 14 18 l30 0 q8 0 8 -9 v-9 z" fill="#293681"/>
    <path d="M746 478 l-8 -148 q-1 -20 20 -26 l22 -6 q14 18 30 18 q16 0 30 -18 l22 6 q21 6 20 26 l-8 148 q-1 13 -15 13 h-98 q-14 0 -15 -13 z" fill="url(#coat)"/>
    <path d="M770 308 l-8 180 q-1 12 -13 12 h-4 q-9 0 -9 -13 l7 -162 q1 -14 14 -18 z" fill="#AEDBEA" opacity="0.92"/>
    <rect x="796" y="314" width="7" height="172" rx="3.5" fill="#274697"/>
    <path d="M746 338 q-18 8 -20 42 l-6 96 q-1 13 11 14 q12 1 14 -12 l8 -92 q2 -18 8 -32 z" fill="#345BBE"/>
    <ellipse cx="728" cy="490" rx="12" ry="14" fill="#F5ECDA"/>
    <path d="M850 330 q40 2 66 40 l-18 18 q-22 -26 -50 -32 z" fill="#345BBE"/>
    <path d="M900 362 l60 40 q10 7 3 16 l-5 7 q-6 8 -16 2 l-54 -40 z" fill="#345BBE"/>
    <ellipse cx="962" cy="418" rx="15" ry="12" fill="#F5ECDA" transform="rotate(26 962 418)"/>
    <ellipse cx="800" cy="260" rx="35" ry="30" fill="#293681"/>
    <ellipse cx="800" cy="279" rx="31" ry="33" fill="#F5ECDA"/>
    <ellipse cx="831" cy="283" rx="6" ry="9" fill="#F5ECDA"/>
    <path d="M769 271 q2 -31 31 -31 q29 0 31 31 q-11 -15 -31 -15 q-20 0 -31 15 z" fill="#293681"/>
    <path d="M789 303 h22 v13 q-11 7 -22 0 z" fill="#E7D8BE"/>
  </g>

  <!-- KYC-verified ID card (upper, between you and the shield) -->
  <g transform="rotate(-7 946 356)" filter="url(#cardShadow)">
    <rect x="858" y="306" width="176" height="106" rx="12" fill="#FFFFFF" stroke="#E7DFCB" stroke-width="2"/>
    <circle cx="900" cy="352" r="24" fill="#DDEBF9"/>
    <circle cx="900" cy="344" r="9" fill="#4274D9"/>
    <path d="M884 372 q16 -18 32 0" fill="#4274D9"/>
    <rect x="938" y="330" width="78" height="9" rx="4.5" fill="#CFE0F7"/>
    <rect x="938" y="348" width="60" height="9" rx="4.5" fill="#E4E9F1"/>
    <rect x="938" y="366" width="70" height="9" rx="4.5" fill="#E4E9F1"/>
    <circle cx="1012" cy="392" r="15" fill="#2FA96B"/>
    <path d="M1004 392 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- OTP login phone (lower, by your hand) -->
  <g transform="rotate(-9 906 512)" filter="url(#cardShadow)">
    <rect x="864" y="440" width="86" height="150" rx="16" fill="#FFFFFF" stroke="#E7DFCB" stroke-width="2"/>
    <rect x="876" y="456" width="62" height="118" rx="8" fill="#EAF2FD"/>
    <rect x="898" y="446" width="18" height="4" rx="2" fill="#CBD8EE"/>
    <path d="M898 486 v-8 q0 -9 9 -9 q9 0 9 9 v8" fill="none" stroke="#4274D9" stroke-width="4"/>
    <rect x="893" y="486" width="28" height="20" rx="4" fill="#4274D9"/>
    <g fill="#4274D9">
      <circle cx="889" cy="528" r="6"/><circle cx="905" cy="528" r="6"/><circle cx="921" cy="528" r="6"/>
    </g>
    <rect x="884" y="548" width="46" height="14" rx="7" fill="#3B74E4"/>
  </g>

  <!-- Coins (gold) -->
  <g>
    <ellipse cx="712" cy="682" rx="30" ry="10" fill="#C7902F"/>
    <rect x="682" y="664" width="60" height="18" fill="#C7902F"/>
    <ellipse cx="712" cy="664" rx="30" ry="10" fill="#EBB94F"/>
    <rect x="682" y="650" width="60" height="14" fill="#C7902F"/>
    <ellipse cx="712" cy="650" rx="30" ry="10" fill="#F2CE70"/>
    <text x="712" y="655" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6B4E16" text-anchor="middle">&#8377;</text>
  </g>

  <!-- Halo badges (lock, fingerprint, check) + sparkles -->
  <g>
    <circle cx="1236" cy="196" r="24" fill="#FFFFFF" stroke="#3B74E4" stroke-width="3"/>
    <path d="M1230 192 v-6 q0 -8 6 -8 q6 0 6 8 v6" fill="none" stroke="#3B74E4" stroke-width="3.5"/>
    <rect x="1226" y="192" width="20" height="16" rx="3" fill="#3B74E4"/>
    <circle cx="1300" cy="286" r="22" fill="#3B74E4"/>
    <path d="M1289 286 l8 9 l15 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1284" cy="440" r="23" fill="#FFFFFF" stroke="#3B74E4" stroke-width="3"/>
    <g fill="none" stroke="#3B74E4" stroke-width="2.6" stroke-linecap="round">
      <path d="M1284 430 q-10 0 -10 12 v6"/>
      <path d="M1284 430 q10 0 10 12 v4"/>
      <path d="M1284 438 q-5 0 -5 7 v5"/>
      <path d="M1284 438 q5 0 5 7 v3"/>
    </g>
    <path d="M980 262 v16 M972 270 h16" stroke="#3B74E4" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M1210 340 v14 M1203 347 h14" stroke="#3B74E4" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="1150" cy="230" r="4.5" fill="#3B74E4" opacity="0.7"/>
  </g>
</svg>
