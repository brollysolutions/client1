# Base compose: datastores + app services for local development.
# NOTE: api/scheduler/web `build:` targets require Dockerfiles that arrive when the apps are
# implemented. Until then, `docker compose up postgres redis` brings up the datastores alone.
services:
  postgres:
    image: postgres:18
    environment:
      # Sourced from the gitignored root .env (mirrors apps/api/.env.local); falls back to app.
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores data in a major-version subdir; mount the parent, not /data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 10"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DB_NAME: ${POSTGRES_DB:-app}
      # postgres:18 speaks scram-sha-256; pgbouncer must store the plaintext password
      # (not md5) so it can SCRAM-authenticate upstream. md5 default -> "wrong password type".
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SPACES_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET_KEY:-minioadmin}
      # The employee document-upload flow PUTs directly from the browser to
      # this origin (presigned URL, not proxied through the API) — without
      # this, every upload fails a CORS preflight since :3001 and :9000 are
      # different origins. DigitalOcean Spaces needs the equivalent bucket
      # CORS rule configured in prod (not something docker-compose controls).
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the dev bucket, then exits. Not depended on by api/scheduler
  # (presigning doesn't need a reachable endpoint) but must finish before an
  # employee actually uploads a file in dev.
  #
  # The `mc anonymous set download .../public/` line (note the TRAILING SLASH
  # -- without it, `mc` scopes both grants to the bare string prefix "public"
  # instead of the "public/" directory, which (a) would anonymously expose
  # any future key merely starting with those 6 characters, not just objects
  # actually under public/, and (b) still grants ListBucket, just scoped to
  # the wrong prefix condition -- verified live against this dev minio) is
  # the dev-stack mirror of the prod bucket policy for banner images (docs
  # §2-13): anonymous s3:GetObject on the public/ prefix only, everything
  # else in the bucket (KYC docs, task documents) stays behind a signed URL.
  # `download` is mc's name for read-only anonymous access. It DOES also
  # grant s3:ListBucket (scoped to this prefix condition, verified live) --
  # that's an accepted, intentional part of `download`, not a gap: nothing
  # under public/ is meant to be secret, only the OTHER prefixes must never
  # be listable, and this grant's `s3:prefix` condition never covers them.
  # Prod's real bucket policy (DigitalOcean Spaces, not this file) should be
  # written with the equivalent explicit `public/*` resource shape, not a
  # bare-prefix approximation.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${SPACES_ACCESS_KEY:-minioadmin} ${SPACES_SECRET_KEY:-minioadmin};
      mc mb -p local/task-documents;
      mc anonymous set download local/task-documents/public/;
      exit 0;
      "

  # Secretless native-code boundary for attacker-controlled loan videos. It
  # has no env_file, application/data-service network, persistent volume, or
  # host-published port. Only scheduler joins media-control.
  media-runtime:
    build:
      context: ./apps/media-runtime
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 64
    expose:
      - "8080"
    networks:
      - media-control
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: dev
    # uv sync on every start keeps the named venv volume current when uv.lock changes without a full image rebuild.
    # Apply migrations before serving so a fresh Postgres volume never yields "relation ... does not exist"
    # on the first write. `alembic upgrade head` is idempotent — a no-op when the DB is already at head.
    command: sh -c "uv run alembic upgrade head && uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000"
    env_file:
      - ./apps/api/.env.local
    environment:
      MEDIA_MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
      MEDIA_VIDEO_PROCESSOR_URL: http://media-runtime:8080
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      # The API runtime has no curl; use stdlib urllib to hit the readiness probe.
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0 if r.status==200 and json.load(r).get('status')=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Cold start runs `uv run alembic upgrade head` (90 migrations) before
      # uvicorn ever binds the port. The old 20s start_period + 5*15s retry
      # budget (95s total) was tight enough that a slow first boot got marked
      # unhealthy before FastAPI came up, which aborted `scheduler` (it has a
      # hard `api: condition: service_healthy` dependency) mid-`docker compose
      # up` even though api recovered seconds later. 90s gives the migration
      # + uv sync + boot path real headroom without weakening steady-state
      # failure detection (interval/retries/timeout are unchanged).
      start_period: 90s

  scheduler:
    build:
      context: ./apps/api
      target: dev
    command: uv run python -m app.scheduler.main
    env_file:
      - ./apps/api/.env.local
    environment:
      MEDIA_MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
      MEDIA_VIDEO_PROCESSOR_URL: http://media-runtime:8080
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for api, which owns `alembic upgrade head`, so scheduler jobs never hit an unmigrated DB.
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy
      media-runtime:
        condition: service_healthy
    networks:
      - default
      - media-control
    healthcheck:
      # No HTTP port; assert the heartbeat job refreshed its liveness marker recently.
      test: ["CMD", "python", "-c", "import os,time,sys; f='/tmp/scheduler.alive'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<150 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./apps/web
      target: dev
    # Keep the container listener at 3000 while publishing 3001 on the host,
    # so local Docker development can coexist with another host app on 3000.
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    ports:
      - "3001:3000"
    depends_on:
      # Plain `- api` only waits for the container to start, not for
      # `alembic upgrade head` + uvicorn bind (api's own start_period comment
      # above: cold start runs 90 migrations before the port opens). web's
      # Server Components fetch api over the docker network on first render,
      # so starting before api is healthy raced Next.js SSR against a still-
      # migrating/not-yet-listening api and produced client-timeout errors
      # (serverFetchJson's 5s AbortSignal) on cold `docker compose up`, the
      # same failure mode scheduler's api dependency below already guards
      # against.
      api:
        condition: service_healthy
    environment:
      # Build-time-inlined, browser-resolved (apps/web/Dockerfile ARGs this in):
      # the browser is on the host network, so it reaches the api container
      # through the published port, not the docker network.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Runtime-only, server-resolved (lib/api/server.ts): Server Components
      # (e.g. ISR-fetched public pages) run inside THIS container, where
      # "localhost" means itself, not the api container — hence a separate
      # var reachable over the docker network, deliberately NOT NEXT_PUBLIC_*
      # so it is read fresh on every request/regeneration instead of being
      # baked into the client bundle at build time.
      API_INTERNAL_URL: http://api:8000
      CI: "true"
    healthcheck:
      # node:alpine has no curl; verify the Next.js listener accepts connections.
      test: ["CMD", "node", "-e", "const net=require('net'); const s=net.connect(3000,'127.0.0.1',()=>process.exit(0)); s.setTimeout(3000,()=>process.exit(1)); s.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  web_node_modules:
  web_next:
  api_venv:
  minio_data:
  clamav_data:

networks:
  media-control:
    internal: true
