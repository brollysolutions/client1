name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python audit
        run: |
          pip install uv
          if [ -f apps/api/pyproject.toml ]; then ( cd apps/api && uv pip compile pyproject.toml -o /tmp/req.txt && uv tool run pip-audit -r /tmp/req.txt ) || true; fi
      - name: Node audit
        run: |
          corepack enable
          if [ -f apps/web/package.json ]; then ( cd apps/web && pnpm audit --prod ) || true; fi
