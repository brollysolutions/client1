name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Review this PR for correctness, security, missing tests,
            migration risk, API contract drift, frontend accessibility,
            scheduler duplicate-run risk, line-segregation / RLS correctness,
            and production readiness.
          claude_args: |
            --max-turns 8
