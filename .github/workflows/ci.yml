name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Point the app at the GitHub service containers (reachable on localhost),
    # not the Docker-compose hostnames the app defaults to. Without this the
    # integration tests could not reach Postgres/Redis and silently skipped.
    env:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install pnpm
        run: corepack enable

      - name: Require living implementation records
        if: github.event_name == 'pull_request'
        run: python scripts/check_feature_tracking.py --base-ref "${{ github.event.pull_request.base.sha }}"

      # A table that ships without RLS is invisible until someone reads across a
      # business line. Catch it in the migration diff, before it reaches a database.
      - name: Require RLS on new tables
        if: github.event_name == 'pull_request'
        run: python scripts/check_migration_rls.py --base-ref "${{ github.event.pull_request.base.sha }}"

      # Apply migrations before the test suite so the RLS policies, api_user role,
      # and constraints the integration tests depend on actually exist.
      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Verify
        run: ./scripts/verify.sh --ci

      - name: Install release browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Production-build browser gate
        working-directory: apps/web
        env:
          # Exercise the client-readiness boundary deterministically instead of
          # depending on hosted-runner hydration timing.
          PLAYWRIGHT_RELEASE_CLIENT_DELAY_MS: "1500"
        run: pnpm test:e2e:release

      # Contract truth: regenerate the OpenAPI spec + typed client and fail if the
      # committed contracts drift from the FastAPI schema.
      - name: Contract drift check
        run: |
          ./scripts/generate-openapi.sh
          ./scripts/generate-client.sh
          git diff --exit-code packages/contracts/ \
            || { echo "::error::Contracts are stale. Run ./scripts/generate-openapi.sh && ./scripts/generate-client.sh and commit packages/contracts/."; exit 1; }
