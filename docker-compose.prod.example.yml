# Production example — copy to docker-compose.prod.yml and adjust.
# Principles (see .claude/rules/docker.md): multi-stage prod images, non-root, health checks,
# config from environment/secrets manager (never baked in), one dedicated scheduler instance.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: ./apps/api
      target: prod
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - ./apps/api/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  scheduler:
    build:
      context: ./apps/api
      target: prod
    command: uv run python -m app.scheduler.main
    env_file:
      - ./apps/api/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1   # exactly one scheduler instance — never scale this service
    restart: always

  web:
    build:
      context: ./apps/web
      target: prod
    command: pnpm start
    env_file:
      - ./apps/web/.env.prod
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
    restart: always

volumes:
  postgres_data:
