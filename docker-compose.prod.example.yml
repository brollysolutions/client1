# Production example — copy to docker-compose.prod.yml and adjust.
# Principles (see .claude/rules/docker.md): multi-stage prod images, non-root, health checks,
# config from environment/secrets manager (never baked in), one dedicated scheduler instance.
services:
  postgres:
    # PostgreSQL 18.6 on Alpine 3.24; publish the reviewed wrapper from
    # docker-compose.runtime-images.yml, then supply its registry manifest hash.
    image: "${RUNTIME_IMAGE_REGISTRY?set RUNTIME_IMAGE_REGISTRY to the approved registry namespace}/postgres:18.6-alpine3.24-20260830@sha256:${POSTGRES_IMAGE_SHA256?set POSTGRES_IMAGE_SHA256 to the reviewed 64-character registry manifest hash}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18 stores data in a major-version subdir; mount the parent, not /data.
      - postgres_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 1G
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    # Redis 8.10.1 on supported Alpine 3.23; final manifest digest is mandatory.
    image: "${RUNTIME_IMAGE_REGISTRY?set RUNTIME_IMAGE_REGISTRY to the approved registry namespace}/redis:8.10.1-alpine3.23-20260830@sha256:${REDIS_IMAGE_SHA256?set REDIS_IMAGE_SHA256 to the reviewed 64-character registry manifest hash}"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  clamav:
    # ClamAV 1.4.6 LTS on Alpine 3.24; signatures remain persisted below.
    image: "${RUNTIME_IMAGE_REGISTRY?set RUNTIME_IMAGE_REGISTRY to the approved registry namespace}/clamav:1.4.6-alpine3.24-20260830@sha256:${CLAMAV_IMAGE_SHA256?set CLAMAV_IMAGE_SHA256 to the reviewed 64-character registry manifest hash}"
    volumes:
      - clamav_data:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 10"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    restart: always

  pgbouncer:
    # PgBouncer 1.25.2 on supported Alpine 3.23 (the prior 3.20 base is EOL).
    image: "${RUNTIME_IMAGE_REGISTRY?set RUNTIME_IMAGE_REGISTRY to the approved registry namespace}/pgbouncer:1.25.2-alpine3.23-20260830@sha256:${PGBOUNCER_IMAGE_SHA256?set PGBOUNCER_IMAGE_SHA256 to the reviewed 64-character registry manifest hash}"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      # postgres:18 speaks scram-sha-256; pgbouncer must store the plaintext password
      # (not md5) so it can SCRAM-authenticate upstream. md5 default -> "wrong password type".
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "40"
      SERVER_RESET_QUERY: "DISCARD ALL"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: ./apps/api
      target: prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - ./apps/api/.env.prod
    environment:
      MEDIA_MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0 if r.status==200 and json.load(r).get('status')=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  scheduler:
    build:
      context: ./apps/api
      target: prod
    command: python -m app.scheduler.main
    env_file:
      - ./apps/api/.env.prod
    environment:
      MEDIA_MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    deploy:
      replicas: 1   # exactly one scheduler instance — never scale this service
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; f='/tmp/scheduler.alive'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<150 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  web:
    build:
      context: ./apps/web
      target: prod
      # The @contracts type import resolves to /packages/contracts in the image;
      # see apps/web/Dockerfile builder stage. Requires Compose v2.17+.
      additional_contexts:
        contracts: ./packages/contracts
      args:
        # Baked into the browser bundle at build time (NEXT_PUBLIC_*). This is the
        # ORIGIN only — the client already appends /api/v1/... itself, so do NOT
        # include a path (…/api would produce /api/api/v1/... and 404). Use:
        #   - a same-origin deploy behind nginx: leave it EMPTY (requests go to
        #     /api/v1/... on the current origin, which nginx proxies to the API);
        #   - a separate API host: its origin, e.g. https://api.example.com
        # The ? guard (not :?) errors only when UNSET, so the empty same-origin
        # value is allowed. The env_file below only sets RUNTIME (SSR) values.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL?set NEXT_PUBLIC_API_BASE_URL for the prod web build (empty = same-origin behind nginx)}
        # Required public identity. `|` separates lines in hours/address. The
        # web image rejects missing values, placeholder hosts, malformed
        # phone/email values, and a non-HTTPS site origin.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL?set NEXT_PUBLIC_SITE_URL to the canonical HTTPS public origin}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE?set NEXT_PUBLIC_CONTACT_PHONE to the verified public international phone number}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL?set NEXT_PUBLIC_CONTACT_EMAIL to the verified public support email}
        NEXT_PUBLIC_CONTACT_HOURS: ${NEXT_PUBLIC_CONTACT_HOURS?set NEXT_PUBLIC_CONTACT_HOURS; use | between display lines}
        NEXT_PUBLIC_CONTACT_ADDRESS: ${NEXT_PUBLIC_CONTACT_ADDRESS?set NEXT_PUBLIC_CONTACT_ADDRESS; use | between display lines}
        # Origin only (e.g. https://nyc3.digitaloceanspaces.com), same origin
        # SPACES_ENDPOINT_URL resolves to on the API side -- next.config.ts
        # turns this into next/image's remotePatterns entry for banner
        # images served from the public/ storage prefix. Required (not
        # optional like the asset host itself being empty would suggest):
        # leaving it unset means every banner image silently fails to
        # render in prod, since lib/public-banners.ts's host guard only
        # allows this value or dev's localhost:9000, and there's no way to
        # notice the gap short of a blank hero card.
        NEXT_PUBLIC_ASSET_HOST: ${NEXT_PUBLIC_ASSET_HOST?set NEXT_PUBLIC_ASSET_HOST to the storage endpoint origin banner images are served from}
    # No command override: the standalone prod image's CMD is `node server.js`
    # (pnpm and package.json scripts are not present in that image).
    #
    # API_INTERNAL_URL (runtime, server-resolved — used by lib/api/server.ts
    # for ISR-fetched public pages) belongs in ./apps/web/.env.prod, not here:
    # unlike NEXT_PUBLIC_API_BASE_URL above, it is never baked into the
    # browser bundle, so it needs no build arg. Point it at wherever the API
    # is reachable from the web container/host in this deployment (e.g. the
    # api service's docker-network name, or its origin if same-origin behind
    # nginx does not apply server-side).
    env_file:
      - ./apps/web/.env.prod
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'); const s=net.connect(3000,'127.0.0.1',()=>process.exit(0)); s.setTimeout(3000,()=>process.exit(1)); s.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  nginx:
    # nginx 1.30.4 stable on Alpine 3.24; includes the July 2026 nginx fixes.
    image: "${RUNTIME_IMAGE_REGISTRY?set RUNTIME_IMAGE_REGISTRY to the approved registry namespace}/nginx:1.30.4-alpine3.24-20260830@sha256:${NGINX_IMAGE_SHA256?set NGINX_IMAGE_SHA256 to the reviewed 64-character registry manifest hash}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      # `nginx -t` alone passes even with an EMPTY conf.d (syntax-valid, zero
      # server blocks, nothing listening) — a false-positive "healthy" while the
      # site is down. The spider request proves a vhost is actually answering.
      test: ["CMD-SHELL", "nginx -t && wget -q --spider http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  postgres_data:
  clamav_data:
