# Dev overrides, layered on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  pgbouncer:
    environment:
      MAX_CLIENT_CONN: "50"
      DEFAULT_POOL_SIZE: "10"
    restart: unless-stopped

  api:
    environment:
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api:/app
      # Keep the image's Linux .venv; don't let the host (Windows) .venv leak through the mount.
      - api_venv:/app/.venv
    restart: unless-stopped

  scheduler:
    environment:
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    restart: unless-stopped

  web:
    environment:
      NODE_ENV: development
      # Polling is required for change detection across the Windows bind mount,
      # but continuous polling ("true") scans the whole tree nonstop and was
      # measured pinning the container at ~850% CPU, starving every dev-server
      # render. A 3s interval keeps hot reload working at a fraction of the cost.
      WATCHPACK_POLLING: "3000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    restart: unless-stopped
