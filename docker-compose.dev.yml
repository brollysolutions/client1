# Dev overrides, layered on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  pgbouncer:
    environment:
      MAX_CLIENT_CONN: "50"
      DEFAULT_POOL_SIZE: "10"
    restart: unless-stopped

  api:
    environment:
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api:/app
      # Keep the image's Linux .venv; don't let the host (Windows) .venv leak through the mount.
      - api_venv:/app/.venv
    restart: unless-stopped

  scheduler:
    environment:
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    restart: unless-stopped

  web:
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    restart: unless-stopped
