# Release-image build input. Build, scan, and publish these tags, then put each
# registry manifest's 64-character sha256 value into the corresponding required
# variable in docker-compose.prod.example.yml. A local image ID is not a
# deployable manifest digest and must never be substituted for that value.
services:
  postgres:
    image: ${RUNTIME_IMAGE_REGISTRY?set RUNTIME_IMAGE_REGISTRY to the approved registry namespace}/postgres:18.6-alpine3.24-20260830
    build:
      context: .
      dockerfile: infra/docker/runtime/postgres.Dockerfile
      args:
        BASE_IMAGE: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

